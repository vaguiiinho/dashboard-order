services:
  # 🗄️ Banco de Dados MySQL
  mysql:
    image: mysql:8.0
    container_name: dashboard_mysql
    env_file:
      - ./.env
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - dashboard_network

  # 🔧 Backend NestJS
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: vaguiiinho/dashboard-backend:1.0.0  
    container_name: dashboard_backend
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - ./.env
    restart: unless-stopped
    networks:
      - dashboard_network

  # 🌐 Frontend Next.js
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: vaguiiinho/dashboard-frontend:1.0.0  
    container_name: dashboard_frontend
    depends_on:
      - backend
    env_file:
      - ./.env
    restart: unless-stopped
    networks:
      - dashboard_network

  # 🔄 Nginx Reverse Proxy
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: vaguiiinho/dashboard-nginx:1.0.0
    container_name: dashboard_nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - dashboard_network

volumes:
  mysql_data:
    driver: local

networks:
  dashboard_network:
    driver: bridge
